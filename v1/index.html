 <div class="work-grid"><button class="work-card" data-page="inspect"><span class="work-icon">${icon('inspect')}</span>${icon('arrow','arrow')}<strong>巡检 / 病害采集</strong><p>发现问题，及时记录</p></button><button class="work-card teal" data-page="maintain"><span class="work-icon">${icon('maintain')}</span>${icon('arrow','arrow')}<strong>养护作业</strong><p>零星养护与计划养护</p></button></div>
 ${section('快捷入口')}
 <div class="common"><button data-page="asset"><span class="mini-icon">${icon('asset')}</span>设施普查</button><button data-facility="巡检上报" data-context="日常工作"><span class="mini-icon">${icon('upload')}</span>巡检上报</button><button data-facility="自巡自养" data-context="日常工作"><span class="mini-icon">${icon('cycle')}</span>自巡自养</button><button data-facility="复核巡查" data-context="日常工作"><span class="mini-icon">${icon('check')}</span>复核巡查</button></div>
 <div class="info-card">${icon('road')}<div><strong>普通公路 · 一线作业工作台</strong><p>设施信息、日常巡检与养护入口，一处直达</p></div></div><div class="footer-note">京橙首护 · 守护道路每一程</div></div>`}
function assetResults(){const arr=assets.filter(x=>(filter==='all'||x[2]===filter)&&x[0].includes(query.trim()));document.getElementById('assetResults').innerHTML=arr.length?grid(arr,'设施普查'):'<div class="empty">未找到相关设施，请尝试其他名称</div>';document.getElementById('assetCount').textContent=`${arr.length} 类设施`}
function renderAsset(){return `<div class="page">${title('资产管理','从设施普查开始，掌握道路家底','asset')}<label class="search">${icon('search')}<input id="assetSearch" type="search" placeholder="搜索设施类型，如桥梁、交通标志" aria-label="搜索设施类型" value="${esc(query)}"></label><div class="filters" role="group" aria-label="设施类别筛选">${[['all','全部设施'],['civil','道路土建'],['safety','交通安全']].map(([id,n])=>`<button class="filter ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${n}</button>`).join('')}</div>${section('设施普查','<span id="assetCount"></span>')}<div id="assetResults"></div><div class="footer-note">分类清晰 · 信息有序</div></div>`}
function renderInspect(){return `<div class="page">${title('道路巡检','发现路上问题，做好每一次记录','inspect')}<button class="feature-row" data-facility="巡检上报" data-context="日常工作"><span class="feature-icon">${icon('upload')}</span><span><strong>巡检上报</strong><p>进入日常巡检上报入口</p></span>${icon('arrow','arrow')}</button>${section('病害采集','按设施选择')}${grid(facilities,'病害采集')}${section('日常工作')}<div class="daily-list">${daily('自巡自养','巡查与日常养护','cycle')}${daily('互巡互检','协同巡查，交叉检查','inspect')}${daily('复核巡查','开展巡查复核工作','check')}</div><div class="footer-note">及时发现 · 有序记录</div></div>`}
function renderMaintain(){return `<div class="page">${title('养护作业','分类开展养护，守护道路畅通','maintain')}<div class="segmented" role="tablist" aria-label="养护类型">${['零星养护','计划养护'].map(n=>`<button role="tab" aria-selected="${maintenance===n}" class="${maintenance===n?'active':''}" data-maintenance="${n}">${n}</button>`).join('')}</div><div role="tabpanel" aria-label="${maintenance}"><div class="maint-info ${maintenance==='计划养护'?'planned':''}"><span>${icon(maintenance==='计划养护'?'calendar':'maintain')}</span><div><strong>${maintenance==='计划养护'?'按计划开展养护':'日常问题，及时养护'}</strong><p>${maintenance==='计划养护'?'选择设施类别，进入计划养护':'选择设施类别，进入零星养护'}</p></div></div>${section('养护设施','8 类设施')}${grid(facilities,maintenance)}</div><div class="info-card">${icon('info')}<div><strong>当前业务：${maintenance}</strong><p>点击设施入口，查看对应养护操作</p></div></div><div class="footer-note">精心养护 · 畅行每一程</div></div>`}
function navigate(id){if(!pages.some(p=>p[0]===id))return;closeSheet(false);current=id;pageEl.innerHTML=({home:renderHome,asset:renderAsset,inspect:renderInspect,maintain:renderMaintain})[id]();viewport.scrollTop=0;document.querySelector('.bottom-nav').innerHTML=pages.map(([key,n,i])=>`<button class="nav-item ${id===key?'active':''}" data-page="${key}" ${id===key?'aria-current="page"':''}><span class="nav-icon">${icon(i)}</span>${n}</button>`).join('');document.querySelector('.page-links').innerHTML=pages.map(([key,n,i])=>`<button data-page="${key}" class="${id===key?'active':''}" ${id===key?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('');if(id==='asset')assetResults();document.title=`${pages.find(x=>x[0]===id)[1]} · 京橙首护原型`}
let selectedName='',selectedContext='';
function openSheet(name,context){previousFocus=document.activeElement;selectedName=name;selectedContext=context;document.getElementById('sheetTitle').textContent=name;document.getElementById('sheetContext').textContent=`普通公路 / ${context}`;const actions=context==='设施普查'?[['list','查看设施'],['plus','新增普查']]:context==='病害采集'?[['plus','采集病害'],['list','查看采集记录']]:context==='日常工作'?[['inspect',name],['list','查看相关记录']]:[['maintain',`进入${context}`],['list','查看养护记录']];document.getElementById('sheetActions').innerHTML=actions.map(([i,n])=>`<button class="sheet-action" data-operation="${n}">${icon(i)}<span>${n}</span>${icon('arrow','arrow')}</button>`).join('');document.getElementById('preview').hidden=true;overlay.hidden=false;document.querySelector('.viewport').inert=true;document.querySelector('.bottom-nav').inert=true;document.querySelector('.sheet').focus()}
function closeSheet(restore=true){overlay.hidden=true;viewport.inert=false;document.querySelector('.bottom-nav').inert=false;if(restore&&previousFocus&&previousFocus.isConnected)previousFocus.focus()}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}const facility=e.target.closest('[data-facility]');if(facility){openSheet(facility.dataset.facility,facility.dataset.context);return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',b.dataset.filter===filter)});assetResults();return}const m=e.target.closest('[data-maintenance]');if(m){const scroll=viewport.scrollTop;maintenance=m.dataset.maintenance;pageEl.innerHTML=renderMaintain();viewport.scrollTop=scroll;document.querySelector(`[data-maintenance="${maintenance}"]`).focus();return}const op=e.target.closest('[data-operation]');if(op){document.querySelectorAll('.sheet-action').forEach(b=>b.classList.toggle('selected',b===op));const preview=document.getElementById('preview');preview.hidden=false;preview.innerHTML=`<span class="demo-badge">功能示意</span><h3>${esc(op.dataset.operation)}</h3><p>已选择「${esc(selectedName)}」的${esc(op.dataset.operation)}入口。</p><div class="context">业务场景：普通公路<br>所属模块：${esc(selectedContext)}<br>本版展示主页面与入口交互，后续业务页面待设计。</div>`;preview.scrollIntoView({block:'nearest',behavior:'smooth'})}});
document.getElementById('closeSheet').innerHTML=icon('close');document.getElementById('closeSheet').addEventListener('click',()=>closeSheet());overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});document.addEventListener('input',e=>{if(e.target.id==='assetSearch'){query=e.target.value;assetResults()}});document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'){closeSheet();return}if(e.key==='Tab'){const all=[...overlay.querySelectorAll('button')];const first=all[0],last=all.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('sheet'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.getElementById('brandIcon').innerHTML=icon('road');navigate('home');
</script>
</body>
</html>
